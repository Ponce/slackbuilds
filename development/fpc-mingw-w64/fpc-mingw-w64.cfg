#
# Free Pascal configuration fragment for Windows cross compilation.
#
# Add the following line to /etc/fpc.cfg or ~/.fpc.cfg:
#
#   #INCLUDE /etc/fpc-mingw-w64.cfg
#

#IFDEF WIN32
-Fu/usr/lib64/fpc/$fpcversion/units/$fpctarget
-Fu/usr/lib64/fpc/$fpcversion/units/$fpctarget/*
-Fl/usr/libexec/mingw-w64-binutils/i686-w64-mingw32/lib
-XPi686-w64-mingw32-
#ENDIF

#IFDEF WIN64
-Fu/usr/lib64/fpc/$fpcversion/units/$fpctarget
-Fu/usr/lib64/fpc/$fpcversion/units/$fpctarget/*
-Fl/usr/libexec/mingw-w64-binutils/x86_64-w64-mingw32/lib
-XPx86_64-w64-mingw32-
#ENDIF
